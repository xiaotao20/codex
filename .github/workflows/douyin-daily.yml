name: douyin-daily-pipeline

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 执行模式
        required: false
        default: all
        type: choice
        options:
          - all
          - fetch
          - transcribe
          - analyze
          - report
      run_date:
        description: 可选，格式为 YYYY-MM-DD
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: douyin-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TRANSCRIBE_MODEL: ${{ vars.OPENAI_TRANSCRIBE_MODEL || 'gpt-4o-mini-transcribe' }}
      OPENAI_ANALYSIS_MODEL: ${{ vars.OPENAI_ANALYSIS_MODEL || 'gpt-4.1-mini' }}
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_USER_AGENT: ${{ secrets.DOUYIN_USER_AGENT }}
      PIPELINE_FORCE_MOCK_AI: ${{ vars.PIPELINE_FORCE_MOCK_AI || 'false' }}
      PIPELINE_MODE: ${{ github.event.inputs.mode || 'all' }}
      PIPELINE_RUN_DATE: ${{ github.event.inputs.run_date || '' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行工作流
        run: |
          python -m app.main --mode "$PIPELINE_MODE" --run-date "$PIPELINE_RUN_DATE"

      - name: 提交状态文件
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/state/processed.json
          if git diff --cached --quiet; then
            echo "状态文件无变化"
          else
            git commit -m "更新抖音状态"
            git push
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-pipeline-${{ github.run_id }}
          path: |
            outputs/reports/**
            outputs/logs/**
            outputs/raw/**
            outputs/transcripts/**
            outputs/analysis/**
          retention-days: 7
